  <rect width="48" height="48" rx="11" fill="#04060d" />
  <ellipse cx="24" cy="24" rx="17" ry="7.6" fill="none" stroke="url(#anelli)" stroke-width="2" transform="rotate(-28 24 24)" />
  <ellipse cx="24" cy="24" rx="11" ry="5" fill="none" stroke="url(#anelli)" stroke-width="1.4" opacity="0.6" transform="rotate(34 24 24)" />
  <circle cx="24" cy="24" r="5.2" fill="url(#nucleo)" />
  <circle cx="37.5" cy="17.5" r="2.2" fill="#22d3ee" />
